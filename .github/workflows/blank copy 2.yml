name: Make OrangeFox Device test

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_URL'
        required: true
      MAINTAINER:
        description: 'OF_MAINTAINER (your name/handle)'
        required: false
        default: 'xz'
      FOX_AB_DEVICE:
        description: 'Is this an A/B (seamless) device? (1 = yes, 0 = no)'
        required: false
        default: '0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt -y install python3 python3-pip cpio wget aria2 zip git
        python3 -m pip install --upgrade pip
        python3 -m pip install twrpdtgen==2.0.0

    - name: Download image
      run: |
        aria2c "${{ github.event.inputs.IMG_URL }}"
        ls -lah

    - name: Generate device tree
      run: |
        mkdir dt
        IMG=$(ls *.img | head -n 1)
        python3 -m twrpdtgen -o dt/ "$IMG"
        ls -R dt

    - name: Create USB config file
      run: |
        cat > /tmp/usb_init.txt << 'EOF'
        
        # =========================================
        # USB Gadget Configuration for OrangeFox
        # =========================================
        on boot
            mount configfs none /config
            mkdir /config/usb_gadget/g1 0770
            mkdir /config/usb_gadget/g1/strings/0x409 0770
            write /config/usb_gadget/g1/bcdUSB 0x0200
            write /config/usb_gadget/g1/strings/0x409/serialnumber ${ro.serialno}
            write /config/usb_gadget/g1/strings/0x409/manufacturer LGE
            write /config/usb_gadget/g1/strings/0x409/product "LG Device"
            mkdir /config/usb_gadget/g1/functions/mass_storage.0
            mkdir /config/usb_gadget/g1/functions/ffs.adb
            mkdir /config/usb_gadget/g1/configs/b.1 0770
            mkdir /config/usb_gadget/g1/configs/b.1/strings/0x409 0770
            write /config/usb_gadget/g1/configs/b.1/strings/0x409/configuration "adb"
            write /config/usb_gadget/g1/configs/b.1/MaxPower 500
            write /config/usb_gadget/g1/idVendor 0x05c6
            write /config/usb_gadget/g1/idProduct 0x9008
            symlink /config/usb_gadget/g1/functions/mass_storage.0 /config/usb_gadget/g1/configs/b.1/f1
            symlink /config/usb_gadget/g1/functions/ffs.adb /config/usb_gadget/g1/configs/b.1/f2
            mkdir /dev/usb-ffs 0775 shell system
            mkdir /dev/usb-ffs/adb 0770 shell system
            mount functionfs adb /dev/usb-ffs/adb uid=2000,gid=1000,rmode=0770,fmode=0660
            write /config/usb_gadget/g1/UDC ${sys.usb.controller}
            setprop sys.usb.config "mass_storage,adb"
            setprop sys.usb.configfs 1
            start adbd
        
        on init
            setprop sys.usb.configfs 1
        
        service adbd /system/bin/adbd --root_seclabel=u:r:recovery:s0
            class core
            socket adbd stream 0660 system system
            disabled
            seclabel u:r:recovery:s0
        EOF
        echo "USB config file created"

    - name: Inject USB config into recovery init
      run: |
        RECOVERY_RC=$(find dt -name "init.recovery.qcom.rc" | head -n 1)
        if [ -z "$RECOVERY_RC" ]; then
          echo "ERROR: init.recovery.qcom.rc not found!"
          exit 1
        fi
        echo "Found: $RECOVERY_RC"
        
        if grep -q "USB Gadget Configuration" "$RECOVERY_RC"; then
          echo "USB config already exists, skipping"
        else
          cat /tmp/usb_init.txt >> "$RECOVERY_RC"
          echo "USB config injected successfully"
        fi

    - name: Detect device info
      id: device
      run: |
        DEVICE_PATH=$(find dt -mindepth 2 -maxdepth 2 -type d | head -n 1)
        BRAND=$(basename $(dirname "$DEVICE_PATH"))
        DEVICE=$(basename "$DEVICE_PATH")
        BRAND=${BRAND:-generic}
        DEVICE=${DEVICE:-unknown}
        echo "BRAND=$BRAND"
        echo "DEVICE=$DEVICE"
        echo "brand=$BRAND" >> $GITHUB_OUTPUT
        echo "device=$DEVICE" >> $GITHUB_OUTPUT
        echo "path=$DEVICE_PATH" >> $GITHUB_OUTPUT

    - name: Rename omni to twrp
      run: |
        cd "${{ steps.device.outputs.path }}"
        DEVICE="${{ steps.device.outputs.device }}"
        if [ -f "omni_${DEVICE}.mk" ]; then
          mv "omni_${DEVICE}.mk" "twrp_${DEVICE}.mk"
        fi
        find . -type f -name "*.mk" -o -name "*.rc" | while read f; do
          sed -i "s/omni_${DEVICE}/twrp_${DEVICE}/g" "$f"
          sed -i "s|vendor/omni|vendor/twrp|g" "$f"
          sed -i "/vendor\/twrp\/config\/gsm\.mk/d" "$f"
        done
        echo "Renamed omni to twrp"

    - name: Add BoardConfig flags
      run: |
        BC="${{ steps.device.outputs.path }}/BoardConfig.mk"
        DM="${{ steps.device.outputs.path }}/device.mk"
        if [ ! -f "$BC" ]; then
          echo "ERROR: BoardConfig.mk not found"
          exit 1
        fi
        
        if [ "${{ github.event.inputs.FOX_AB_DEVICE }}" = "0" ]; then
          if [ -f "$DM" ]; then
            echo "" >> "$DM"
            echo "PRODUCT_BUILD_RECOVERY_IMAGE := true" >> "$DM"
          fi
          echo "" >> "$BC"
          echo "BOARD_USES_RECOVERY_AS_BOOT := false" >> "$BC"
        fi
        
        echo "" >> "$BC"
        echo "TW_MAX_BRIGHTNESS := 255" >> "$BC"
        echo "TW_DEFAULT_BRIGHTNESS := 150" >> "$BC"
        echo "TARGET_SUPPORTS_64_BIT_APPS := false" >> "$BC"
        echo "TARGET_SUPPORTS_32_BIT_APPS := true" >> "$BC"
        echo "OF_MAINTAINER := ${{ github.event.inputs.MAINTAINER }}" >> "$BC"
        echo "OF_AB_DEVICE := ${{ github.event.inputs.FOX_AB_DEVICE }}" >> "$BC"
        echo "OF_USE_MAGISKBOOT := 1" >> "$BC"
        echo "OF_USE_MAGISKBOOT_FOR_ALL_PATCHES := 1" >> "$BC"
        echo "OF_USE_TWRP_SAR_DETECT := 1" >> "$BC"
        echo "OF_KEEP_RECOVERY_TWRP_FOLDER_NAME := 1" >> "$BC"
        echo "OF_FLASHLIGHT_ENABLE := 1" >> "$BC"
        echo "OF_ENABLE_LOCKSCREEN := 1" >> "$BC"
        echo "OF_USE_LOCKSCREEN := 1" >> "$BC"
        echo "OF_STATUS_INDENT_LEFT := 48" >> "$BC"
        echo "OF_STATUS_INDENT_TOP := 16" >> "$BC"
        echo "OF_CLOCK_POS := 30" >> "$BC"
        echo "OF_HIDE_NOTCH := 1" >> "$BC"
        echo "BoardConfig.mk updated"

    - name: Add vendorsetup flags
      run: |
        VS="${{ steps.device.outputs.path }}/vendorsetup.sh"
        if [ ! -f "$VS" ]; then
          touch "$VS"
        fi
        echo "" >> "$VS"
        echo "export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1" >> "$VS"
        echo "export FOX_REPLACE_LIBTAR_WITH_LIBARCHIVE=1" >> "$VS"
        echo "export FOX_USE_NANO_EDITOR=1" >> "$VS"
        echo "export FOX_USE_TAR_BINARY=1" >> "$VS"
        echo "export FOX_USE_SED_BINARY=1" >> "$VS"
        echo "export FOX_USE_XZ_UTILS=1" >> "$VS"
        echo "export FOX_ASH_IS_BASH=1" >> "$VS"
        echo "export FOX_VANILLA_BUILD=0" >> "$VS"
        echo "export FOX_VARIANT_BUILD=SAR" >> "$VS"
        echo "export FOX_BUILD_TYPE=Unofficial" >> "$VS"
        echo "export FOX_ENABLE_APP_MANAGER=1" >> "$VS"
        echo "vendorsetup.sh updated"

    - name: Create repository
      run: |
        REPO_NAME="android_device_${{ steps.device.outputs.brand }}_${{ steps.device.outputs.device }}"
        REPO_NAME=$(echo "$REPO_NAME" | tr -cd '[:alnum:]_')
        echo "Creating repo: $REPO_NAME"
        curl -X POST https://api.github.com/user/repos \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -d "{\"name\":\"$REPO_NAME\",\"private\":false}"
        echo "repo=$REPO_NAME" >> $GITHUB_ENV

    - name: Push to GitHub
      run: |
        cd dt/${{ steps.device.outputs.brand }}/${{ steps.device.outputs.device }}
        git init
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add .
        git commit -m "OrangeFox DT with USB gadget support"
        git branch -M main
        git remote add origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/${{ env.repo }}.git
        git push --force origin main
