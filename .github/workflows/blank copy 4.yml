name: Make OrangeFox Device last1

on:
  workflow_dispatch:
    inputs:
      IMG_URL:
        description: 'IMG_URL'
        required: true
      MAINTAINER:
        description: 'OF_MAINTAINER (your name/handle)'
        required: false
        default: 'xz'
      FOX_AB_DEVICE:
        description: 'Is this an A/B (seamless) device? (1 = yes, 0 = no)'
        required: false
        default: '0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check Out
      uses: actions/checkout@v4

    - name: Prepare environment
      run: |
        sudo apt update
        sudo apt -y install python3 python3-pip cpio wget aria2 zip git
        python3 -m pip install --upgrade pip
        python3 -m pip install twrpdtgen==2.0.0

    - name: Download image
      run: |
        aria2c "${{ github.event.inputs.IMG_URL }}"
        ls -lah

    - name: Generate device tree
      run: |
        mkdir dt
        IMG=$(ls *.img | head -n 1)
        python3 -m twrpdtgen -o dt/ "$IMG"
        ls -R dt

    # 🔥 RELIABLE DETECTION (NO BROKEN GREP)
    - name: Detect device info
      id: device
      run: |
        # Get path like dt/samsung/a5ltechn
        DEVICE_PATH=$(find dt -mindepth 2 -maxdepth 2 -type d | head -n 1)

        BRAND=$(basename $(dirname "$DEVICE_PATH"))
        DEVICE=$(basename "$DEVICE_PATH")

        # fallback safety
        BRAND=${BRAND:-generic}
        DEVICE=${DEVICE:-unknown}

        echo "Detected BRAND=$BRAND"
        echo "Detected DEVICE=$DEVICE"

        echo "brand=$BRAND" >> $GITHUB_OUTPUT
        echo "device=$DEVICE" >> $GITHUB_OUTPUT
        echo "path=$DEVICE_PATH" >> $GITHUB_OUTPUT

    - name: Fix ConfigFS USB gadget override
      run: |
        DEVICE_PATH="${{ steps.device.outputs.path }}"
        RC_DIR="$DEVICE_PATH/recovery/root"
        RC_FILE="$RC_DIR/init.recovery.usb.rc"

        # This REPLACES twrpdtgen's/vendor-twrp's default USB init entirely
        # (paired with TW_EXCLUDE_DEFAULT_USB_INIT := true in BoardConfig.mk,
        # added below) rather than layering on top of it. The previous
        # approach bound the UDC once, statically, in an `on boot` block —
        # which fails (-ENODEV, "failed to start g1: -19", repeating in a
        # tight loop) because a FunctionFS-backed function's ep0 must be
        # opened by its userspace daemon *before* the UDC bind is attempted.
        # Modeled on a known-working OrangeFox device tree (OnePlus kona):
        # functions are created once at boot, but the UDC is only ever
        # bound inside property-triggered actions gated on
        # `sys.usb.ffs.ready=1`, i.e. only after adbd has actually
        # configured its endpoint. Mass storage (kernel-native, not
        # FunctionFS-backed) doesn't need that gate and is bound alongside
        # adb in the combined "mass_storage,adb" trigger below.
        mkdir -p "$RC_DIR"

        cat > "$RC_FILE" << 'EOF'
        on early-init
            setprop sys.usb.configfs 0

        on init
            mkdir /config
            mount configfs none /config
            mkdir /config/usb_gadget/g1 0770 shell shell
            write /config/usb_gadget/g1/bcdUSB 0x0200
            write /config/usb_gadget/g1/idVendor 0x18d1
            write /config/usb_gadget/g1/idProduct 0x4ee7
            mkdir /config/usb_gadget/g1/strings/0x409 0770 shell shell
            write /config/usb_gadget/g1/strings/0x409/serialnumber ${ro.serialno}
            write /config/usb_gadget/g1/strings/0x409/manufacturer LGE
            write /config/usb_gadget/g1/strings/0x409/product "LG Device"
            mkdir /config/usb_gadget/g1/functions/ffs.adb
            mkdir /config/usb_gadget/g1/functions/mass_storage.0
            mkdir /config/usb_gadget/g1/configs/b.1 0770
            mkdir /config/usb_gadget/g1/configs/b.1/strings/0x409 0770
            write /config/usb_gadget/g1/configs/b.1/MaxPower 500
            mkdir /dev/usb-ffs 0775 shell system
            mkdir /dev/usb-ffs/adb 0770 shell system
            mount functionfs adb /dev/usb-ffs/adb uid=2000,gid=1000,rmode=0770,fmode=0660
            # TWRP's own "Enable USB Storage" toggle is compiled out
            # regardless of TW_NO_USB_STORAGE/TARGET_USE_CUSTOM_LUN_FILE_PATH
            # on this build (confirmed: unaffected even by a `mka
            # TW_NO_USB_STORAGE=false` command-line override), so nothing
            # in TWRP ever writes the mass_storage.0 LUN backing file. We
            # create one ourselves here instead: a small FAT32 image on
            # /cache, lazily created once, then pointed at directly below.
            # This is NOT your internal storage (/data/media is
            # ext4/F2FS, unreadable by a Windows/macOS host without a
            # driver) — it's a blank scratch drive for moving files
            # in/out during a recovery session (ROM zips, pulled backups).
            # UNVERIFIED: assumes /cache is already mounted and mkfs.fat
            # exists on this ramdisk by the time `exec` runs here — check
            # the next recovery.log/dmesg for exec/mkfs.fat errors if the
            # drive still doesn't appear.
            exec u:r:recovery:s0 -- /sbin/sh -c "mkdir -p /cache/usbstorage; test -f /cache/usbstorage/drive.img || (dd if=/dev/zero of=/cache/usbstorage/drive.img bs=1M count=256 && mkfs.fat -F 32 /cache/usbstorage/drive.img)"
            setprop sys.usb.configfs 1

        # Kick off the default mode once the gadget skeleton above exists.
        on boot
            setprop sys.usb.config mass_storage,adb

        # ---- Teardown: run before any mode switch rebinds the gadget ----
        on property:sys.usb.config=none && property:sys.usb.configfs=1
            write /config/usb_gadget/g1/UDC "none"
            stop adbd
            setprop sys.usb.ffs.ready 0
            write /config/usb_gadget/g1/bDeviceClass 0
            write /config/usb_gadget/g1/bDeviceSubClass 0
            write /config/usb_gadget/g1/bDeviceProtocol 0
            rm /config/usb_gadget/g1/configs/b.1/f1
            rm /config/usb_gadget/g1/configs/b.1/f2
            setprop sys.usb.state ${sys.usb.config}

        on property:init.svc.adbd=stopped
            setprop sys.usb.ffs.ready 0

        # ---- adb-only mode ----
        on property:sys.usb.config=adb && property:sys.usb.configfs=1
            start adbd

        on property:sys.usb.ffs.ready=1 && property:sys.usb.config=adb && property:sys.usb.configfs=1
            write /config/usb_gadget/g1/configs/b.1/strings/0x409/configuration "adb"
            symlink /config/usb_gadget/g1/functions/ffs.adb /config/usb_gadget/g1/configs/b.1/f1
            write /config/usb_gadget/g1/UDC ${sys.usb.controller}
            setprop sys.usb.state ${sys.usb.config}

        # ---- mass storage + adb (default) ----
        on property:sys.usb.config=mass_storage,adb && property:sys.usb.configfs=1
            start adbd

        on property:sys.usb.ffs.ready=1 && property:sys.usb.config=mass_storage,adb && property:sys.usb.configfs=1
            write /config/usb_gadget/g1/configs/b.1/strings/0x409/configuration "mass_storage_adb"
            write /config/usb_gadget/g1/functions/mass_storage.0/lun.0/file /cache/usbstorage/drive.img
            symlink /config/usb_gadget/g1/functions/mass_storage.0 /config/usb_gadget/g1/configs/b.1/f1
            symlink /config/usb_gadget/g1/functions/ffs.adb /config/usb_gadget/g1/configs/b.1/f2
            write /config/usb_gadget/g1/UDC ${sys.usb.controller}
            setprop sys.usb.state ${sys.usb.config}

        on property:ro.boot.usbcontroller=*
            setprop sys.usb.controller ${ro.boot.usbcontroller}

        service adbd /system/bin/adbd --root_seclabel=u:r:recovery:s0
            class core
            socket adbd stream 0660 system system
            disabled
            seclabel u:r:recovery:s0
        EOF

        echo "----- Wrote $RC_FILE -----"
        cat "$RC_FILE"

        # Clean up any leftover file/import from the old static-binding
        # approach, if this tree was previously patched by an earlier run.
        OLD_RC="$DEVICE_PATH/recovery/root/system/etc/init/init.recovery.usbgadget.rc"
        rm -f "$OLD_RC"
        TOP_RC=$(find "$DEVICE_PATH/recovery/root" -maxdepth 1 -name 'init.recovery.*.rc' | head -n 1)
        if [ -n "$TOP_RC" ]; then
          sed -i '\#import /system/etc/init/init.recovery.usbgadget.rc#d' "$TOP_RC"
        fi

    - name: Fix recovery.fstab USB entries
      run: |
        FSTAB="${{ steps.device.outputs.path }}/recovery.fstab"
        
        if [ -f "$FSTAB" ]; then
          echo "----- Original recovery.fstab -----"
          cat "$FSTAB"
          
          # Remove problematic wildcard logical partitions that cause USB detection to fail
          sed -i '/^\/mmc_host\*/d' "$FSTAB"
          sed -i '/^\/usb\*/d' "$FSTAB"
          
          echo "----- Fixed recovery.fstab (removed broken logical partitions) -----"
          cat "$FSTAB"
        else
          echo "WARNING: recovery.fstab not found at $FSTAB"
        fi

    - name: Rename omni to twrp
      run: |
        cd "${{ steps.device.outputs.path }}"
        DEVICE="${{ steps.device.outputs.device }}"

        if [ -f "omni_${DEVICE}.mk" ]; then
          mv "omni_${DEVICE}.mk" "twrp_${DEVICE}.mk"
        fi

        # Confirmed against a real fox_12.1 checkout:
        #   vendor/twrp/config/ contains common.mk, packages.mk,
        #   BoardConfigKernel.mk, BoardConfigSoong.mk, BoardConfigTWRP.mk
        #   — there is NO gsm.mk. So: rename omni_* -> twrp_*, rewrite
        # vendor/omni -> vendor/twrp, and drop the gsm.mk inherit line
        # entirely (it never exists under vendor/twrp/config).
        grep -rlI "omni" . 2>/dev/null | while read -r f; do
          sed -i \
            -e "s/omni_${DEVICE}/twrp_${DEVICE}/g" \
            -e "s/vendor\/omni/vendor\/twrp/g" \
            -e "s/Omni stuff/TWRP stuff/g" \
            -e "/vendor\/twrp\/config\/gsm\.mk/d" \
            "$f"
        done

        echo "----- remaining omni refs -----"
        grep -rniI "omni" . || echo "none"

    - name: Add OrangeFox flags to BoardConfig.mk
      run: |
        BC="${{ steps.device.outputs.path }}/BoardConfig.mk"
        DM="${{ steps.device.outputs.path }}/device.mk"

        if [ ! -f "$BC" ]; then
          echo "ERROR: BoardConfig.mk not found at $BC"
          exit 1
        fi

        # Non-A/B devices (separate recovery partition) need this explicitly,
        # or AOSP's core Makefile leaves INSTALLED_RECOVERYIMAGE_TARGET empty
        # and the recoveryimage target silently becomes a no-op.
        if [ "${{ github.event.inputs.FOX_AB_DEVICE }}" = "0" ]; then
          if [ -f "$DM" ]; then
            cat >> "$DM" << 'EOF'

        # This device has a separate recovery partition and needs an
        # actual recovery.img built (see BoardConfig.mk note).
        PRODUCT_BUILD_RECOVERY_IMAGE := true
        EOF
          fi
          cat >> "$BC" << 'EOF'

        # Non-A/B device with a separate recovery partition
        BOARD_USES_RECOVERY_AS_BOOT := false
        EOF
        fi

        cat >> "$BC" << EOF

        # =========================================
        # USB Storage Configuration
        # TW_MTP_DEVICE is intentionally NOT set here: it forces TWRP onto
        # the legacy android_usb character-device MTP path (e.g.
        # /dev/mtp_usb), which doesn't exist on this ConfigFS gadget setup.
        #
        # TW_EXCLUDE_DEFAULT_USB_INIT tells TWRP's build to skip its own
        # generic init.recovery.usb.rc entirely, since the device tree now
        # supplies its own (recovery/root/init.recovery.usb.rc) — without
        # this, the two fight over the same sys.usb.config property with
        # conflicting legacy vs ConfigFS write paths.
        #
        # TARGET_USE_CUSTOM_LUN_FILE_PATH tells TWRP's own mass-storage
        # backend where to write the LUN backing file for a ConfigFS
        # gadget when the user toggles "Mount USB Storage" — without it,
        # the mass_storage.0 function binds but has no medium behind it
        # ("LUN: removable file: (no medium)" in dmesg, drive never shows
        # up on the host even though the device enumerates).
        # =========================================
        TW_NO_USB_STORAGE := false
        RECOVERY_SDCARD_ON_DATA := true
        TW_EXCLUDE_DEFAULT_USB_INIT := true
        TARGET_USE_CUSTOM_LUN_FILE_PATH := /config/usb_gadget/g1/functions/mass_storage.0/lun.%d/file

        # =========================================
        # Recovery UI — twrpdtgen cannot detect the backlight
        # driver's max value from the image alone; 255 is the
        # common default on Qualcomm devices, verify against
        # kernel source if you have it.
        # =========================================
        TW_MAX_BRIGHTNESS := 255
        TW_DEFAULT_BRIGHTNESS := 150

        # =========================================
        # Architecture: recovery images on 64-bit SoCs
        # are conventionally built 32-bit-app-only
        # =========================================
        TARGET_SUPPORTS_64_BIT_APPS := false
        TARGET_SUPPORTS_32_BIT_APPS := true

        # =========================================
        # OrangeFox Recovery specific flags
        # (appended automatically, review before building)
        # =========================================
        OF_MAINTAINER := ${{ github.event.inputs.MAINTAINER }}
        OF_AB_DEVICE := ${{ github.event.inputs.FOX_AB_DEVICE }}
        OF_USE_MAGISKBOOT := 1
        OF_USE_MAGISKBOOT_FOR_ALL_PATCHES := 1
        OF_USE_TWRP_SAR_DETECT := 1
        OF_KEEP_RECOVERY_TWRP_FOLDER_NAME := 1
        OF_FLASHLIGHT_ENABLE := 1
        OF_ENABLE_LOCKSCREEN := 1
        OF_USE_LOCKSCREEN := 1
        OF_STATUS_INDENT_LEFT := 48
        OF_STATUS_INDENT_TOP := 16
        OF_CLOCK_POS := 30
        OF_HIDE_NOTCH := 1
        OF_SUPPORT_HTC_STYLE := 0
        OF_ALLOW_DISABLE_NAVBAR := 0
        EOF

        echo "----- Updated BoardConfig.mk -----"
        cat "$BC"

    - name: Add OrangeFox flags to vendorsetup.sh
      run: |
        VS="${{ steps.device.outputs.path }}/vendorsetup.sh"

        # IMPORTANT: FOX_* build vars must NOT live in BoardConfig.mk (or any
        # .mk file). Make doesn't strip quote characters from a variable's
        # value the way a shell does, so a line like:
        #   FOX_BUILD_TYPE := "Unofficial"
        # makes $(FOX_BUILD_TYPE) literally equal to  "Unofficial"  (quotes
        # included). OrangeFox's own build/core then wraps that value in
        # quotes AGAIN when generating -D flags, producing the broken
        # #define FOX_BUILD_TYPE ""Unofficial""
        # which clang rejects with "invalid suffix on literal". OrangeFox's
        # docs also state FOX_* vars are only reliably read from a shell
        # script (vendorsetup.sh) or an exported env var — never from a .mk
        # file. So these go here instead, as plain unquoted exports.
        if [ ! -f "$VS" ]; then
          touch "$VS"
        fi

        cat >> "$VS" << 'EOF'

        # =========================================
        # OrangeFox Recovery specific flags
        # (appended automatically, review before building)
        # =========================================
        export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
        export FOX_REPLACE_LIBTAR_WITH_LIBARCHIVE=1
        export FOX_USE_NANO_EDITOR=1
        export FOX_USE_TAR_BINARY=1
        export FOX_USE_SED_BINARY=1
        export FOX_USE_XZ_UTILS=1
        export FOX_ASH_IS_BASH=1
        export FOX_VANILLA_BUILD=0
        export FOX_VARIANT_BUILD=SAR
        export FOX_BUILD_TYPE=Unofficial
        export FOX_ENABLE_APP_MANAGER=1
        EOF

        echo "----- Updated vendorsetup.sh -----"
        cat "$VS"

    - name: Create repository
      run: |
        REPO_NAME="android_device_${{ steps.device.outputs.brand }}_${{ steps.device.outputs.device }}"
        REPO_NAME=$(echo "$REPO_NAME" | tr -cd '[:alnum:]_')

        echo "Creating repo: $REPO_NAME"

        curl -X POST https://api.github.com/user/repos \
          -H "Authorization: token ${{ secrets.GH_PAT }}" \
          -d "{\"name\":\"$REPO_NAME\",\"private\":false}"

        echo "repo=$REPO_NAME" >> $GITHUB_ENV

    - name: Push device tree
      run: |
        cd dt/${{ steps.device.outputs.brand }}/${{ steps.device.outputs.device }}

        git init
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add .
        git commit -m "Initial OrangeFox device tree (twrpdtgen + OF flags + USB storage fix)"

        git branch -M main

        git remote add origin https://${{ secrets.GH_PAT }}@github.com/${{ github.repository_owner }}/${{ env.repo }}.git
        git push --force origin main
